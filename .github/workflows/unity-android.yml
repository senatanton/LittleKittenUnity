name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: unityci/editor:2022.3.69f1-android-1
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Activate Unity
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile - -username "" -password "" -serial "" -licenseFile <(echo "${{ secrets.UNITY_LICENSE }}")
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Android
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit -projectPath . -executeMethod GameManager.BuildAndroid -logFile -