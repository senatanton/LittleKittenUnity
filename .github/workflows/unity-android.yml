name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          UNITY_VERSION="2022.3.69f1"
          # Use the hash from Unity download page
          UNITY_HASH="6b4c29b7e7f3"
          UNITY_URL="https://download.unity3d.com/download_unity/${UNITY_HASH}/LinuxEditorInstaller/UnitySetup-${UNITY_VERSION}"
          
          curl -f -o UnitySetup ${UNITY_URL}
          chmod +x UnitySetup
          ./UnitySetup --unattended --install-location=/opt/unity --components=Unity,Android
          echo "/opt/unity/Editor" >> $GITHUB_PATH

      - name: Activate Unity
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit -createManualActivationFile -logFile -
          echo "${{ secrets.UNITY_LICENSE }}" > /tmp/unity_license.ulf
          /opt/unity/Editor/Unity -batchmode -nographics -quit -licenseFile /tmp/unity_license.ulf -logFile -

      - name: Build Android
        run: |
          /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -projectPath /github/workspace \
            -executeMethod GameManager.BuildAndroid \
            -logFile -