name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: unityci/editor:2022.3.69f1-android-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Activate Unity
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Android
        run: |
          /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -projectPath /github/workspace \
            -executeMethod GameManager.BuildAndroid \
            -logFile -