name: Build Android APK

on:
 push:
 branches: [main]
 workflow_dispatch:

permissions:
 contents: read

jobs:
 build:
 name: Build APK
 runs-on: ubuntu-latest
 timeout-minutes: 60

 container:
 image: unityci/editor:ubuntu-2022.1.0f1-android-4.0.0

 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Cache Library
 uses: actions/cache@v4
 with:
 path: Library
 key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
 restore-keys: |
 Library-${{ runner.os }}-

 - name: Activate Unity
 env:
 UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
 UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
 run: |
 /opt/unity/Editor/Unity -batchmode -nographics \
 -logFile - \
 -username ${{ secrets.UNITY_USERNAME }} \
 -password ${{ secrets.UNITY_PASSWORD }}

 - name: Build Android
 run: |
 /opt/unity/Editor/Unity -batchmode -nographics \
 -projectPath ${{ github.workspace }} \
 -executeMethod UnityEditor.BuildPlayerWindow/DefaultBuildMethods.BuildPlayer \
 -buildTarget Android \
 -outputPath ${{ github.workspace }}/Build/LittleKitten.apk \
 -logFile -

 - name: Upload APK
 uses: actions/upload-artifact@v4
 with:
 name: LittleKitten-APK
 path: Build/LittleKitten.apk
