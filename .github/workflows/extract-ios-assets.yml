name: Extract iOS Assets

on:
  workflow_dispatch:

jobs:
  extract:
    name: Extract Assets.car on macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA from release
        run: |
          # Download the IPA from the release
          curl -L -o LittleKitten.ipa "https://github.com/senatanton/LittleKittenUnity/releases/download/ios-extract/Little.Kitten.Virtual.Pet.Cat.v4.8.3.v5.34.Univ.FW.LP.64bit.os130.ok18.-user_hidden.bfi2.ipa"
          ls -la LittleKitten.ipa

      - name: Extract .app from IPA
        run: |
          unzip -q LittleKitten.ipa -d Payload
          ls -la Payload/

      - name: Find Assets.car
        run: |
          find Payload -name "Assets.car" -type f
          ASSET_CAR=$(find Payload -name "Assets.car" -type f | head -1)
          echo "ASSET_CAR=$ASSET_CAR" >> $GITHUB_ENV

      - name: Extract Assets.car using assetutil
        run: |
          mkdir -p ExtractedAssets
          cd ExtractedAssets
          assetutil -I "$ASSET_CAR" -o .
          find . -type f | head -50

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: ExtractedAssets/**
          retention-days: 7