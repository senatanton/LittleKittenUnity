name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar gzip

      - name: Download Unity
        run: |
          UNITY_VERSION="2022.3.69f1"
          UNITY_URL="https://download.unity3d.com/download_unity/${UNITY_VERSION}/LinuxEditorInstaller/Unity-${UNITY_VERSION}.tar.xz"
          wget -q "$UNITY_URL" -O unity.tar.xz
          mkdir -p /opt/unity
          tar -xf unity.tar.xz -C /opt/unity --strip-components=1
          echo "/opt/unity/Editor" >> $GITHUB_PATH

      - name: Activate Unity
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile - -username "" -password "" -serial "" -licenseFile <(echo "${{ secrets.UNITY_LICENSE }}")
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Android
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit -projectPath . -executeMethod GameManager.BuildAndroid -logFile -